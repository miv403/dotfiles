# HYPRLOCK CONFIGURATION

general {
    grace = 0                  # Keypress window before forcing lock
    disable_loading_bar = true
}

background {
    monitor =
    path = screenshot          # Seamlessly targets your current wallpaper/view
    blur_passes = 3            # High quality blur effect
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

# TIME WIDGET (Clock)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 0.8)
    font_size = 90
    font_family = Sans
    position = 0, 100
    halign = center
    valign = center
}

# INPUT BOX (Password field)
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = Sans
    placeholder_text = <i>Enter Password...</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}
