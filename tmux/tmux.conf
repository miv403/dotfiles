# Options
set -sg terminal-overrides ",*:RGB"  # true color support
set -g escape-time 0  # disable delays on escape sequences
set -g mouse on
set -g renumber-windows on  # keep numbering sequential
set -g repeat-time 1000  # increase "prefix-free" window

set -g automatic-rename on
set -g automatic-rename-format "#{b:pane_current_command}"

# Options: start indexes from 1
set -g base-index 1
set -g pane-base-index 1

# Change prefix
unbind C-b
set -g prefix `
bind ` send-prefix

# Theme: borders
set -g pane-border-lines simple
# set -g pane-border-style fg=black,bright
set -g pane-border-style "fg=#504945,nobold"
# set -g pane-active-border-style fg=magenta
set -g pane-active-border-style fg='#98971a'

# Theme: status
# set -g status-style bg=default,fg=black,bright
set -g status-style "bg=default,fg=#98971a,bright"
set -g status-left "#[bg=#98971a,fg=#282828,bold]   #[fg=#98971a,bg=default] "
# set -g status-right "#[fg=black,bright]#S"
# set -g status-right "#[fg=#98971a,bright]#S"
# set -g status-right "#[fg=#98971a]#S #[fg=#504945]| #[fg=#ebdbb2]#{pane_current_path}"
# set -g status-right "#[fg=#98971a]#S #[fg=#504945]| #[fg=#ebdbb2]#{b:pane_current_path}"
# set -g status-right "#[fg=#98971a]#[bg=#98971a,fg=#282828,bold] #S #[fg=#504945]| #[fg=#ebdbb2]#{pane_current_path} "
# set -g status-right "#[fg=#98971a]#[bg=#98971a,fg=#282828,bold] #S #[fg=#504945]| #[fg=#ebdbb2]#{pane_current_path} "
set -g status-right "#[fg=#98971a]#[bg=#98971a,fg=#282828,bold] #S "

# Theme: status (windows)
set -g window-status-format "○ #I #W"
set -g window-status-current-format "[● #I #W]"
set -g window-status-style "fg=#504945,nobold"
# set -g window-status-current-style "#{?window_zoomed_flag,fg=yellow,fg=magenta,nobold}"
set -g window-status-current-style "#{?window_zoomed_flag,fg=yellow,fg=#98971a,bold}" # Changed from fg=magenta
set -g window-status-bell-style "fg=red,nobold"

# Keybindings: wasd
bind w select-pane -U
bind a select-pane -L
bind s select-pane -D
bind d select-pane -R

bind -r W resize-pane -U
bind -r A resize-pane -L
bind -r S resize-pane -D
bind -r D resize-pane -R

# Keybindings: disable repeat for arrows
bind Up select-pane -U
bind Left select-pane -L
bind Down select-pane -D
bind Right select-pane -R

# Keybindings: split
bind h split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}" 
bind - split-window -v -c "#{pane_current_path}" 

# Keybindings: windows
bind -n C-Tab next-window
bind -n C-S-Tab previous-window

bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# Keybindings: other
bind f resize-pane -Z
bind q detach-client
bind e choose-window -Z

bind -n M-w select-pane -U
bind -n M-a select-pane -L
bind -n M-s select-pane -D
bind -n M-d select-pane -R
bind -n M-f resize-pane -Z
