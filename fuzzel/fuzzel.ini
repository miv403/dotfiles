# https://github.com/LeonardMH/gruvbox-arch-linux/blob/main/fuzzel/fuzzel.ini
[main]
font=Victor Mono Nerd Font:size=12
icon-theme=Cawnonical-Orange
icons-enabled=yes
prompt="> "
lines=15
width=50
horizontal-pad=20
vertical-pad=10
inner-pad=10
fields=filename,name,generic,categories,keywords

[colors]
# Gruvbox Dark color scheme
# background=282828ff
background=282828cc
text=ebdbb2ff
match=fe8019ff
selection=3c3836cc
selection-match=fabd2fcc
selection-text=ebdbb2ff
border=504945ff
prompt=ebdbb2ff

[border]
width=2
radius=8

[dmenu]
mode=text
