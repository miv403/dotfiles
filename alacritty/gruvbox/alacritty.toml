# https://github.com/alacritty/alacritty-theme/blob/master/themes/gruvbox_dark.toml
# Colors (Gruvbox dark)
[bell]
animation = "EaseOutSine"
color = "#ffffff"
command = "pwd"

[colors.cursor]
cursor = "#ddbb88"
text = "CellBackground"

[colors.line_indicator]
background = "#001b0c"
foreground = "None"

# Default colors
[colors.primary]
# hard contrast background = = '#1d2021'
background = '#282828'
# soft contrast background = = '#32302f'
foreground = '#ebdbb2'

# Normal colors
[colors.normal]
black   = '#282828'
red     = '#cc241d'
green   = '#98971a'
yellow  = '#d79921'
blue    = '#458588'
magenta = '#b16286'
cyan    = '#689d6a'
white   = '#a89984'

# Bright colors
[colors.bright]
black   = '#928374'
red     = '#fb4934'
green   = '#b8bb26'
yellow  = '#fabd2f'
blue    = '#83a598'
magenta = '#d3869b'
cyan    = '#8ec07c'
white   = '#ebdbb2'

[cursor.style]
blinking = "On"
shape = "Block"

[font]
builtin_box_drawing = true
size = 12.0

[font.bold]
family = "VictorMono NF"
style = "Bold"

[font.bold_italic]
family = "VictorMono NF"
style = "Bold Italic"

[font.italic]
family = "VictorMono NF"
style = "Italic"

[font.normal]
# Default = ["VictorMono NF"]
family = "VictorMono NF"
style = "Regular"

[window]
dynamic_title = true
opacity = 0.95
title = "mivpc"
